name: 生成安卓安装包

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: android-actions/setup-android@v3
      - name: 准备安卓开发工具
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0' 'platform-tools'
      - name: 准备阅读器模型
        run: python android/scripts/prepare-assets.py
      - name: 编译并检查
        working-directory: android
        run: ./gradlew assembleDebug testDebugUnitTest lintDebug --console=plain
      - name: 保存安装包与检查结果
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: monogatari-android
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/reports/tests/testDebugUnitTest/
            android/app/build/reports/lint-results-debug.html
          if-no-files-found: error
